<!DOCTYPE html>
<html>
<head>
	<title>nMarkdownViewer</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<link rel="stylesheet" href="modules/nui_wc2/NUI/css/nui-theme.css">
	<link rel="stylesheet" href="modules/nui_wc2/NUI/css/modules/nui-app-window.css">
	<link rel="stylesheet" href="modules/nui_wc2/NUI/css/modules/nui-file-tree.css">
	<link rel="stylesheet" href="modules/nui_wc2/NUI/css/modules/nui-rich-text.css">
	<link rel="stylesheet" href="modules/nui_wc2/NUI/css/modules/nui-syntax-highlight.css">
	<link rel="stylesheet" href="css/main.css">
	<script src="js/app.js" type="module"></script>
</head>
<body>
	<nui-app id="shell" sidebar-width="24.7rem" content-width="62rem" content-min-width="50rem" nui-vars-sidebar-right_force-breakpoint="none">
		<nui-skip-links></nui-skip-links>

		<nui-app-header>
			<header>
				<div slot="left">
					<nui-button variant="icon" data-action="toggle-sidebar">
						<button type="button" aria-label="Toggle sidebar"><nui-icon name="menu"></nui-icon></button>
					</nui-button>
					<span id="doc-title">nMarkdownViewer</span>
				</div>
				<div slot="right">
					<nui-button variant="icon" id="btn-edit">
						<button type="button" aria-label="Edit" disabled><nui-icon name="edit"></nui-icon></button>
					</nui-button>
					<nui-button variant="icon" id="btn-save">
						<button type="button" aria-label="Save" disabled><nui-icon name="save"></nui-icon></button>
					</nui-button>
					<nui-button variant="icon" id="btn-listen">
						<button type="button" aria-label="Listen" disabled><nui-icon name="volume"></nui-icon></button>
					</nui-button>
					<nui-button variant="icon" data-action="toggle-sidebar:right">
						<button type="button" aria-label="TTS settings"><nui-icon name="settings"></nui-icon></button>
					</nui-button>
				</div>
			</header>
		</nui-app-header>

		<nui-sidebar behavior="primary">
			<nav>
				<div id="sidebar-tools">
					<nui-button variant="ghost" id="btn-open-folder">
						<button type="button"><nui-icon name="folder_open"></nui-icon> Open Folder</button>
					</nui-button>
					<nui-button variant="icon" id="btn-open-file">
						<button type="button" aria-label="Open file"><nui-icon name="description"></nui-icon></button>
					</nui-button>
					<nui-button variant="icon" id="btn-collapse">
						<button type="button" aria-label="Collapse all" disabled><nui-icon name="unfold_less"></nui-icon></button>
					</nui-button>
					<nui-button variant="icon" id="btn-refresh">
						<button type="button" aria-label="Refresh tree" disabled><nui-icon name="sync"></nui-icon></button>
					</nui-button>
				</div>
				<div id="sidebar-search">
					<nui-input id="tree-search" clearable>
						<input type="text" placeholder="Filter files…" aria-label="Filter files">
					</nui-input>
				</div>
				<nui-file-tree id="file-tree" aria-label="Files" selectable="files" density="cozy">
					<nav></nav>
				</nui-file-tree>
			</nav>
		</nui-sidebar>

		<nui-sidebar position="right">
			<div class="config-pane">
				<span class="config-title">Configuration</span>
				<nui-input-group class="sidebar-section">
					<label>Engine</label>
					<nui-select id="cfg-engine">
						<select aria-label="TTS engine"></select>
					</nui-select>
				</nui-input-group>
				<nui-input-group class="sidebar-section">
					<label>Voice</label>
					<nui-select id="cfg-voice" searchable>
						<select aria-label="TTS voice"></select>
					</nui-select>
				</nui-input-group>
				<nui-input-group class="sidebar-section">
					<label for="cfg-speed-input">Speed</label>
					<nui-input id="cfg-speed">
						<input type="number" id="cfg-speed-input" min="0.25" max="4" step="0.05" value="1.0">
					</nui-input>
				</nui-input-group>
				<nui-input-group class="sidebar-section">
					<label>Markdown cleanup</label>
					<nui-checkbox>
						<input type="checkbox" id="cfg-clean" checked>
						<label for="cfg-clean">Clean markdown (server-side)</label>
					</nui-checkbox>
				</nui-input-group>
				<nui-input-group class="sidebar-section">
					<label>Long text</label>
					<nui-checkbox>
						<input type="checkbox" id="cfg-stitch">
						<label for="cfg-stitch">Seamless joins (slow)</label>
					</nui-checkbox>
				</nui-input-group>
				<div id="cfg-status" class="config-status" hidden></div>
			</div>
		</nui-sidebar>

		<nui-content>
			<nui-main id="md-main">
				<nui-page id="page">
					<div id="welcome">
						<h1>nMarkdownViewer</h1>
						<p class="lead">Open a folder in the sidebar to browse Markdown files, or drop a <code>.md</code> file anywhere.</p>
					</div>
				</nui-page>
			</nui-main>
			<nui-rich-text id="editor" placeholder="Markdown content…" hidden></nui-rich-text>
			<div id="tts-mount"></div>
		</nui-content>
	</nui-app>
</body>
</html>
